[project]
name = "local-ai-with-ollama"
version = "0.1.0"
description = "A hands-on tutorial series for building with local LLMs via Ollama"
requires-python = ">=3.13"
dependencies = [
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
